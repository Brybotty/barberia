<router-outlet></router-outlet>

<!-- Confirmaciones y aviso de cookies de toda la app -->
<app-confirmar />
<app-aviso-cookies />

<!-- Avisos: arriba y al centro, donde no tapan los botones de guardar ni de confirmar -->
@if (notificationService.toastMessage(); as toast) {
  <div class="fixed inset-x-3 top-3 z-[9999] animate-in slide-in-from-top-5 fade-in duration-300 sm:inset-x-0 sm:top-5 sm:mx-auto sm:w-fit"
       [attr.role]="toast.tipo === 'error' ? 'alert' : 'status'" [attr.aria-live]="toast.tipo === 'error' ? 'assertive' : 'polite'">
    <div class="relative rounded-2xl border bg-neutral-950 p-4 pr-12 shadow-2xl shadow-black sm:min-w-[20rem] sm:max-w-md" [ngClass]="estilosToast[toast.tipo].caja">
      <div class="flex items-start gap-3.5">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border" [ngClass]="estilosToast[toast.tipo].icono">
          <app-icono [nombre]="estilosToast[toast.tipo].nombre" class="h-5 w-5" [grosor]="2" />
        </div>
        <div class="min-w-0 pt-0.5">
          <p class="font-bold text-white">{{ toast.title }}</p>
          @if (toast.body) {
            <p class="mt-0.5 text-sm leading-snug text-neutral-400">{{ toast.body }}</p>
          }
        </div>
      </div>
      <button type="button" (click)="notificationService.cerrarToast()" aria-label="Cerrar aviso" class="absolute right-1.5 top-1.5 flex h-10 w-10 items-center justify-center rounded-full text-neutral-500 transition-colors hover:text-white">
        <app-icono nombre="cerrar" class="h-4 w-4" [grosor]="2.2" />
      </button>
    </div>
  </div>
}
