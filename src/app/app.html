<router-outlet></router-outlet>

<!-- Toast Notification Global -->
@if (notificationService.toastMessage(); as toast) {
  <div class="fixed bottom-6 right-6 z-[9999] animate-in slide-in-from-bottom-5 fade-in duration-300">
    <div class="bg-neutral-900 border shadow-2xl rounded-2xl p-4 pr-12 relative max-w-sm" [ngClass]="estilosToast[toast.tipo].caja">
      <div class="flex items-start gap-4">
        <div class="rounded-full p-2 flex-shrink-0" [ngClass]="estilosToast[toast.tipo].icono">
          @switch (toast.tipo) {
            @case ('exito') {
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            }
            @case ('error') {
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            }
            @default {
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            }
          }
        </div>
        <div>
          <h4 class="text-white font-bold mb-1">{{ toast.title }}</h4>
          @if (toast.body) {
            <p class="text-neutral-400 text-sm leading-tight">{{ toast.body }}</p>
          }
        </div>
      </div>
      <button (click)="notificationService.cerrarToast()" class="absolute top-4 right-4 text-neutral-500 hover:text-white transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
  </div>
}
